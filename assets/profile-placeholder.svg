<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bg-grad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#ring-grad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Main Avatar Card -->
  <circle cx="200" cy="200" r="140" fill="url(#avatar-grad)" filter="url(#card-shadow)"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Monogram Initials -->
  <text x="200" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">DP</text>

  <!-- Small Subtitle in Badge -->
  <rect x="110" y="325" width="180" height="34" rx="17" fill="#ffffff" filter="url(#card-shadow)"/>
  <text x="200" y="347" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle" dominant-baseline="middle">DURGA PRASAD KOYYA</text>
</svg>
